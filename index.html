<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title></title>

<style>

/* =========================================
   ОСНОВА
========================================= */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;

    background:
        linear-gradient(
            rgba(40, 15, 35, 0.18),
            rgba(20, 5, 25, 0.35)
        ),
        radial-gradient(
            circle at 75% 25%,
            rgba(255, 190, 215, 0.9) 0%,
            rgba(255, 150, 190, 0.35) 12%,
            transparent 32%
        ),
        linear-gradient(
            120deg,
            #f8b7ce 0%,
            #f7d1dc 30%,
            #d99aad 65%,
            #5d3849 100%
        );

    background-size: cover;
    background-position: center;

    display: flex;
    align-items: center;
    justify-content: center;
}


/* =========================================
   ФОН С САКУРОЙ
========================================= */

body::before {
    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            ellipse at 10% 15%,
            rgba(55, 25, 30, 0.85) 0%,
            rgba(55, 25, 30, 0.5) 4%,
            transparent 13%
        ),

        radial-gradient(
            ellipse at 90% 5%,
            rgba(55, 25, 30, 0.75) 0%,
            rgba(55, 25, 30, 0.35) 5%,
            transparent 15%
        ),

        radial-gradient(
            circle at 15% 18%,
            #fff0f5 0%,
            #ffb5ce 2%,
            transparent 5%
        ),

        radial-gradient(
            circle at 25% 10%,
            #ffe6ef 0%,
            #f99fbd 2%,
            transparent 5%
        ),

        radial-gradient(
            circle at 85% 14%,
            #ffe9f1 0%,
            #ffadc6 2%,
            transparent 5%
        ),

        radial-gradient(
            circle at 75% 8%,
            #fff1f6 0%,
            #ffb3ca 2%,
            transparent 5%
        );

    opacity: 0.95;
}


body::after {
    content: "";

    position: fixed;

    inset: 0;

    pointer-events: none;

    background:
        radial-gradient(
            circle at center,
            transparent 20%,
            rgba(0, 0, 0, 0.28) 100%
        );
}


/* =========================================
   КАРТОЧКА
========================================= */

.card {
    position: relative;

    z-index: 20;

    width: min(90vw, 560px);

    min-height: 340px;

    max-height: 94vh;

    overflow-y: auto;

    padding: 42px 28px;

    border-radius: 32px;

    background:
        rgba(255, 255, 255, 0.14);

    border:
        1px solid
        rgba(255, 255, 255, 0.4);

    backdrop-filter:
        blur(14px);

    -webkit-backdrop-filter:
        blur(14px);

    box-shadow:
        0 20px 60px
        rgba(0, 0, 0, 0.3),

        inset 0 0 30px
        rgba(255, 255, 255, 0.12);

    text-align: center;

    color: white;

    animation:
        cardAppear 1s ease;
}


/* =========================================
   ПЕРВОЕ ОКНО
========================================= */

h1 {
    margin: 0 0 18px;

    font-size:
        clamp(30px, 7vw, 50px);

    font-weight: 700;

    text-shadow:
        0 3px 12px
        rgba(0,0,0,0.4);
}


.question {
    font-size:
        clamp(18px, 4.5vw, 25px);

    margin-bottom: 35px;

    text-shadow:
        0 2px 8px
        rgba(0,0,0,0.4);
}


/* =========================================
   ОБЛАСТЬ КНОПОК
========================================= */

.button-area {
    position: relative;

    width: 100%;

    height: 125px;

    overflow: hidden;
}


button {
    border: none;

    outline: none;

    border-radius: 50px;

    padding: 14px 26px;

    min-width: 120px;

    font-size: 18px;

    font-weight: 700;

    cursor: pointer;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,0.25);
}


/* =========================================
   ДА
========================================= */

#yes {
    position: absolute;

    left: 8%;

    top: 25px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #ff7098,
            #ff3f75
        );

    transition:
        transform 0.2s ease;
}


#yes:hover {
    transform:
        scale(1.08);
}


#yes:active {
    transform:
        scale(0.94);
}


/* =========================================
   НЕТ
========================================= */

#no {
    position: absolute;

    left: 55%;

    top: 25px;

    color: #8c4660;

    background:
        rgba(255,255,255,0.85);

    transition:
        left 0.22s
        cubic-bezier(.2,.8,.3,1),

        top 0.22s
        cubic-bezier(.2,.8,.3,1);
}


/* =========================================
   ВТОРОЕ ОКНО
========================================= */

.success {
    display: none;
}


.success.show {
    display: block;

    animation:
        successAppear
        0.8s
        cubic-bezier(.17,.67,.32,1.3);
}


.main.hide {
    display: none;
}


/* =========================================
   СЕРДЦЕ
========================================= */

.heart {
    font-size:
        clamp(65px, 18vw, 90px);

    margin-bottom: 8px;

    animation:
        heartbeat
        1.2s
        ease-in-out
        infinite;

    filter:
        drop-shadow(
            0 0 12px #ff6f9b
        )

        drop-shadow(
            0 0 30px
            rgba(255,80,130,0.7)
        );
}


/* =========================================
   НАДПИСЬ
========================================= */

.success-title {
    font-size:
        clamp(24px, 6vw, 40px);

    font-weight: 700;

    margin-bottom: 12px;

    text-shadow:
        0 3px 12px
        rgba(0,0,0,0.4);
}


.choose-text {
    font-size:
        clamp(17px, 4.5vw, 22px);

    margin:
        10px 0 20px;

    text-shadow:
        0 2px 8px
        rgba(0,0,0,0.4);
}


/* =========================================
   ВЫБОР ДАТЫ И ВРЕМЕНИ
========================================= */

.date-time-box {
    display: flex;

    flex-direction: column;

    align-items: center;

    gap: 10px;
}


.date-time-box label {
    font-size: 16px;

    font-weight: 600;

    margin-top: 4px;
}


.date-time-box input {
    width:
        min(100%, 300px);

    padding:
        13px 16px;

    border:
        none;

    border-radius:
        15px;

    outline:
        none;

    background:
        rgba(255,255,255,0.92);

    color:
        #743b52;

    font-size:
        17px;

    font-family:
        inherit;

    box-shadow:
        0 5px 20px
        rgba(0,0,0,0.18);
}


/* =========================================
   КНОПКА ПОДТВЕРДИТЬ
========================================= */

#confirmDate {
    margin-top: 20px;

    color: white;

    background:
        linear-gradient(
            135deg,
            #ff7098,
            #ff3f75
        );

    transition:
        transform 0.2s ease;
}


#confirmDate:hover {
    transform:
        scale(1.05);
}


#confirmDate:active {
    transform:
        scale(0.95);
}


/* =========================================
   ФИНАЛЬНОЕ СООБЩЕНИЕ
========================================= */

.final-message {
    display: none;

    animation:
        successAppear
        0.7s ease;
}


.final-message.show {
    display: block;
}


.selected-date {
    margin-top: 20px;

    padding: 18px;

    border-radius: 20px;

    background:
        rgba(255,255,255,0.16);

    border:
        1px solid
        rgba(255,255,255,0.3);

    font-size:
        clamp(18px, 4.5vw, 24px);

    line-height: 1.6;

    text-shadow:
        0 2px 8px
        rgba(0,0,0,0.4);
}


.waiting {
    margin-top: 18px;

    font-size:
        clamp(17px, 4.5vw, 22px);

    text-shadow:
        0 2px 8px
        rgba(0,0,0,0.4);
}


/* =========================================
   ЛЕПЕСТКИ
========================================= */

#fallingLeaves {
    position: fixed;

    inset: 0;

    z-index: 10;

    pointer-events: none;

    overflow: hidden;
}


.petal {
    position: absolute;

    top: -50px;

    width: 14px;

    height: 9px;

    border-radius:
        100% 0 100% 0;

    opacity: 0.85;

    filter:
        drop-shadow(
            0 2px 3px
            rgba(0,0,0,0.12)
        );

    animation:
        fall linear forwards;
}


/* =========================================
   АНИМАЦИИ
========================================= */

@keyframes fall {

    0% {
        transform:
            translate3d(
                0,
                -50px,
                0
            )
            rotate(0deg);
    }

    25% {
        margin-left: 80px;
    }

    50% {
        margin-left: -70px;
    }

    75% {
        margin-left: 100px;
    }

    100% {
        transform:
            translate3d(
                0,
                110vh,
                0
            )
            rotate(900deg);
    }
}


@keyframes cardAppear {

    from {
        opacity: 0;

        transform:
            translateY(40px)
            scale(0.92);
    }

    to {
        opacity: 1;

        transform:
            translateY(0)
            scale(1);
    }
}


@keyframes successAppear {

    0% {
        opacity: 0;

        transform:
            scale(0.5)
            translateY(50px);
    }

    70% {
        transform:
            scale(1.05)
            translateY(-5px);
    }

    100% {
        opacity: 1;

        transform:
            scale(1)
            translateY(0);
    }
}


@keyframes heartbeat {

    0%,
    100% {
        transform:
            scale(1);
    }

    50% {
        transform:
            scale(1.18);
    }
}


/* =========================================
   ТЕЛЕФОН
========================================= */

@media (max-width: 600px) {

    .card {
        width: 92vw;

        max-height: 92vh;

        padding:
            30px 18px;

        border-radius:
            26px;
    }


    .question {
        margin-bottom:
            25px;
    }


    button {
        min-width:
            105px;

        padding:
            13px 22px;

        font-size:
            16px;
    }


    #yes {
        left:
            7%;
    }


    #no {
        left:
            55%;
    }
}


@media (max-width: 380px) {

    .card {
        padding:
            25px 12px;
    }


    button {
        min-width:
            95px;

        padding:
            12px 18px;
    }

}

</style>
</head>


<body>


<!-- =========================================
     ЛЕПЕСТКИ
========================================= -->

<div id="fallingLeaves"></div>


<!-- =========================================
     ФОНОВАЯ МУЗЫКА
     
     ПОЛОЖИ ФАЙЛ music.mp3
     В ОДНУ ПАПКУ С ЭТИМ HTML
========================================= -->

<audio
    id="backgroundMusic"
    loop
    preload="auto"
>

    <source
        src="John Michael Howell Story Of A Warrior.mp3"
        type="audio/mpeg"
    >

</audio>


<!-- =========================================
     ПЕРВОЕ ОКНО
========================================= -->

<div
    class="card main"
    id="mainCard"
>

    <h1>
        🌸 Приглашение 🌸
    </h1>


    <div class="question">
        Приходи ко мне домой? 🥰
    </div>


    <div
        class="button-area"
        id="buttonArea"
    >

        <button id="yes">
            Да ❤️
        </button>


        <button id="no">
            Нет 🙈
        </button>

    </div>

</div>


<!-- =========================================
     ВТОРОЕ ОКНО
========================================= -->

<div
    class="card success"
    id="successCard"
>


    <div class="heart">
        ❤️
    </div>


    <div class="success-title">
        Я знал, что ты придёшь! 😏
    </div>


    <div class="choose-text">
        Теперь выбери дату и время встречи 🌸
    </div>


    <!-- =====================================
         ВЫБОР ДАТЫ
    ====================================== -->

    <div id="datePicker">

        <div class="date-time-box">


            <label for="date">
                📅 Выбери дату
            </label>


            <input
                type="date"
                id="date"
            >


            <label for="time">
                🕐 Выбери время
            </label>


            <input
                type="time"
                id="time"
            >

        </div>


        <button
            id="confirmDate"
        >
            Подтвердить ❤️
        </button>

    </div>


    <!-- =====================================
         РЕЗУЛЬТАТ
    ====================================== -->

    <div
        class="final-message"
        id="finalMessage"
    >

        <div
            class="selected-date"
            id="selectedDate"
        ></div>


        <div class="waiting">
            Жду тебя! 🥰🌸
        </div>

    </div>

</div>


<script>

/* =========================================
   ЭЛЕМЕНТЫ
========================================= */

const noButton =
    document.getElementById(
        "no"
    );


const yesButton =
    document.getElementById(
        "yes"
    );


const buttonArea =
    document.getElementById(
        "buttonArea"
    );


const mainCard =
    document.getElementById(
        "mainCard"
    );


const successCard =
    document.getElementById(
        "successCard"
    );


const fallingLeaves =
    document.getElementById(
        "fallingLeaves"
    );


const backgroundMusic =
    document.getElementById(
        "backgroundMusic"
    );


const dateInput =
    document.getElementById(
        "date"
    );


const timeInput =
    document.getElementById(
        "time"
    );


const confirmDate =
    document.getElementById(
        "confirmDate"
    );


const datePicker =
    document.getElementById(
        "datePicker"
    );


const finalMessage =
    document.getElementById(
        "finalMessage"
    );


const selectedDate =
    document.getElementById(
        "selectedDate"
    );


/* =========================================
   КНОПКА "НЕТ"
========================================= */

function moveNoButton() {

    const areaWidth =
        buttonArea.clientWidth;


    const areaHeight =
        buttonArea.clientHeight;


    const buttonWidth =
        noButton.offsetWidth;


    const buttonHeight =
        noButton.offsetHeight;


    const maxX =
        Math.max(
            0,
            areaWidth -
            buttonWidth
        );


    const maxY =
        Math.max(
            0,
            areaHeight -
            buttonHeight
        );


    const x =
        Math.random() *
        maxX;


    const y =
        Math.random() *
        maxY;


    noButton.style.left =
        x + "px";


    noButton.style.top =
        y + "px";
}


/* Компьютер */

noButton.addEventListener(
    "mouseenter",
    moveNoButton
);


/* Телефон */

noButton.addEventListener(
    "touchstart",
    function(event) {

        event.preventDefault();

        moveNoButton();

    },
    {
        passive: false
    }
);


/* Если всё-таки нажали */

noButton.addEventListener(
    "click",
    function(event) {

        event.preventDefault();

        moveNoButton();

    }
);


/* =========================================
   КНОПКА "ДА"
========================================= */

yesButton.addEventListener(
    "click",
    function() {


        /* Показываем второе окно */

        mainCard.classList.add(
            "hide"
        );


        successCard.classList.add(
            "show"
        );


        /*
         * Запускаем твою музыку.
         *
         * Музыка начинает играть
         * именно после нажатия "Да",
         * поэтому на телефоне это
         * обычно разрешённое действие.
         */

        backgroundMusic
            .play()
            .catch(
                function(error) {

                    console.log(
                        "Музыка не запустилась:",
                        error
                    );

                }
            );


        /* Дополнительные лепестки */

        for (
            let i = 0;
            i < 40;
            i++
        ) {

            setTimeout(
                createPetal,
                i * 60
            );

        }

    }
);


/* =========================================
   ВЫБОР ДАТЫ И ВРЕМЕНИ
========================================= */

confirmDate.addEventListener(
    "click",
    function() {


        const date =
            dateInput.value;


        const time =
            timeInput.value;


        /* Проверяем выбор */

        if (
            !date ||
            !time
        ) {

            alert(
                "Сначала выбери дату и время 🌸"
            );

            return;

        }


        /*
         * Преобразуем дату
         * в красивый русский формат.
         */

        const dateObject =
            new Date(
                date +
                "T00:00:00"
            );


        const formattedDate =
            dateObject.toLocaleDateString(
                "ru-RU",
                {
                    day:
                        "numeric",

                    month:
                        "long",

                    year:
                        "numeric"
                }
            );


        /*
         * Показываем выбранные
         * дату и время.
         */

        selectedDate.innerHTML =
            "📅 " +
            formattedDate +
            "<br>" +
            "🕐 " +
            time;


        /*
         * Убираем выбор.
         */

        datePicker.style.display =
            "none";


        /*
         * Показываем результат.
         */

        finalMessage.classList.add(
            "show"
        );

    }
);


/* =========================================
   ЛЕПЕСТКИ
========================================= */

function createPetal() {


    const petal =
        document.createElement(
            "div"
        );


    petal.className =
        "petal";


    petal.style.left =
        Math.random() *
        100 +
        "vw";


    const size =
        7 +
        Math.random() *
        15;


    petal.style.width =
        size +
        "px";


    petal.style.height =
        size *
        0.68 +
        "px";


    const colors = [

        "#ffb3c9",
        "#ffcadb",
        "#ff9fbd",
        "#ffd9e5",
        "#f78faf",
        "#fff0f5",
        "#e98ca9"

    ];


    petal.style.background =
        colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ];


    const duration =
        5 +
        Math.random() *
        8;


    petal.style.animationDuration =
        duration +
        "s";


    petal.style.animationDelay =
        Math.random() *
        2 +
        "s";


    fallingLeaves.appendChild(
        petal
    );


    setTimeout(
        function() {

            petal.remove();

        },
        (duration + 3) *
        1000
    );

}


/* Первые лепестки */

for (
    let i = 0;
    i < 80;
    i++
) {

    setTimeout(
        createPetal,
        i * 70
    );

}


/* Постоянный дождь */

setInterval(
    createPetal,
    180
);


/* =========================================
   ПОВОРОТ ТЕЛЕФОНА
========================================= */

window.addEventListener(
    "resize",
    function() {


        const x =
            parseFloat(
                noButton.style.left
            ) || 0;


        const y =
            parseFloat(
                noButton.style.top
            ) || 25;


        const maxX =
            Math.max(
                0,
                buttonArea.clientWidth -
                noButton.offsetWidth
            );


        const maxY =
            Math.max(
                0,
                buttonArea.clientHeight -
                noButton.offsetHeight
            );


        noButton.style.left =
            Math.min(
                x,
                maxX
            ) +
            "px";


        noButton.style.top =
            Math.min(
                y,
                maxY
            ) +
            "px";

    }
);

</script>

</body>
</html>
 ⁠
